<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Coach Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Create Coach Profile</h1>
    <p class="subtitle">Create a coach account so you can browse athletes.</p>

    <div id="message" style="display:none;"></div>

    <form id="coachForm">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="school">School / Program *</label>
        <input type="text" id="school" required>
      </div>
      <div class="form-group">
        <label for="sport">Sport</label>
        <input type="text" id="sport" placeholder="e.g. Track & Field">
      </div>
      <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" id="password" required minlength="4">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
      <button type="submit" class="btn">Save Coach Profile</button>
    </form>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="athletes.html">Browse Athletes</a>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById('coachForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const coaches = getCoaches();
      const coach = {
        id: generateId(),
        name: document.getElementById('name').value.trim(),
        school: document.getElementById('school').value.trim(),
        sport: document.getElementById('sport').value.trim() || 'Not listed',
        email: document.getElementById('email').value.trim() || 'Not listed',
        password: document.getElementById('password').value,
        created: new Date().toISOString()
      };
      coaches.push(coach);
      saveCoaches(coaches);

      const msg = document.getElementById('message');
      msg.className = 'success';
      msg.style.display = 'block';
      msg.textContent = 'Coach profile saved!';
      document.getElementById('coachForm').reset();
    });
  </script>
</body>
</html>
